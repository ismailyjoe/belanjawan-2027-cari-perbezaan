<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24553d"><title>Belanjawan 2027 — Cari Perbezaan</title></head>
<body><p id="loading" role="status">Memuatkan ilustrasi Belanjawan…</p>
<script>
(async()=>{
  try{
    const response=await fetch('game-original.html?v=5',{cache:'no-cache'});
    if(!response.ok)throw Error('Gambar gagal dimuatkan.');
    const original=(await response.text()).replace('Had masa 5 minit','Had masa 3 minit');
    if(!original.includes('function begin(){')||!original.includes("artwork.src='data:image/"))throw Error('Fail permainan tidak lengkap.');
    const upgraded=original+'<scr'+'ipt src="classic-upgrade.js?v=11"></scr'+'ipt>';
    document.open();document.write(upgraded);document.close();
  }catch(error){
    const notice=document.getElementById('loading');
    if(notice){notice.textContent='Permainan gagal dimuatkan. Sila muat semula halaman. ';const link=document.createElement('a');link.href='game-original.html';link.textContent='Buka versi asal';notice.append(link);}
  }
})();
</script></body></html>
